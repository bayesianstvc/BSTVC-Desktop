<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="BSTVC 官网背景方案 A 时空呼吸终稿"><title>BSTVC 官网背景｜方案 A 时空呼吸｜终稿 V01</title><style> :root { color-scheme: dark; --cyan: #3fe9ff; --blue: #1d78ff; --violet: #a05bf5; --orange: #ff8f54; } * { box-sizing: border-box; } html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #01040d; } body { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; } #bstvc-background { position: fixed; inset: 0; overflow: hidden; isolation: isolate; background: #01040d; } #scene { position: absolute; inset: -1.8%; transform-origin: center; will-change: transform; } #source-art, #motion-overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; } #motion-overlay { overflow: visible; pointer-events: none; } #source-art { user-select: none; -webkit-user-drag: none; } #spatial-grid, #earth-texture, #earth-sheen, #relation-layer, #time-layer, #beta-field, #star-field { transform-box: view-box; } #spatial-grid { transform-origin: 474px 691px; mix-blend-mode: screen; } #earth-texture { transform-origin: 474px 691px; will-change: transform; } #earth-sheen, #relation-silhouette, #relation-sweep, #relation-return, .moon-halo, .moon-spark { mix-blend-mode: screen; } .beta-node { transform-box: fill-box; transform-origin: center; mix-blend-mode: screen; will-change: opacity, transform, filter; } #relation-sweep, #time-axis { vector-effect: non-scaling-stroke; } .shade { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: linear-gradient(90deg, rgba(0, 3, 10, 0.14), transparent 34%, transparent 82%, rgba(0, 4, 13, 0.12)), linear-gradient(180deg, rgba(0, 2, 8, 0.08), transparent 68%, rgba(0, 2, 8, 0.20)); } .controls { position: fixed; right: 22px; bottom: 20px; z-index: 20; display: none; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid rgba(100, 225, 255, 0.22); border-radius: 999px; background: rgba(2, 8, 20, 0.80); color: #dff8ff; backdrop-filter: blur(14px); } body.show-controls .controls { display: flex; } .controls button { border: 0; border-radius: 999px; padding: 7px 12px; background: rgba(82, 211, 255, 0.14); color: inherit; cursor: pointer; } .controls input { width: 118px; accent-color: #45e2f0; } .controls .name { max-width: 220px; font-size: 12px; opacity: 0.76; } body.chromeless .controls { display: none !important; } @media (max-width: 820px) { #scene { inset: -5%; } #source-art { object-position: 12% center; } .shade { background: linear-gradient(180deg, rgba(0, 3, 10, 0.05), transparent 52%, rgba(0, 2, 8, 0.58)), linear-gradient(90deg, rgba(0, 3, 10, 0.08), transparent 70%); } } @media (prefers-reduced-motion: reduce) and (max-width: 0px) { #scene { transform: none !important; } #relation-layer, #star-field, #beta-field, #time-layer { opacity: 0.18 !important; } #earth-texture { transform: none !important; } } /* 方案 A 终稿：地球保持输入图中的静止状态。 */ #earth-texture, #earth-sheen, #spatial-grid { display: none !important; } </style></head><body data-variant="A_FINAL"><main id="bstvc-background"><div id="scene"><img id="source-art" src="data:image/webp;base64,UklGRgaKAQBXRUJQVlA4IPqJAQDwygWdASqIBq0DPj0ejUUiIaMlIhQ4qKAHiWdtEb3//E1YJWmd18xH9N8JTpMg3Vz9D5GXx9PyvQ949O+rkkxrRHdI0vOl96hfrOLnfze9wLhmUAvMnzj3HfQm8DmhHIqtU3w+CzIf37+v9yPwsch+EnvH8N/mv91/ff3N+8H+3/6fQr4L/o/+D7qvh76I/6n+V/1H7WfOn/mf9n/X+8H+p/5//k/5v95PoG/VD/Qf3z/S/9v/D//////W3/4/+R73/8p/1f+p+xnwH/oH9u/5f+E/ev5p//B+1Pur/z3/B/7n/A/4HyA/33/If8789Pjx/+fuc/6D/x//r3Bf6d/kf/R7Sn/V/+3+7/5X/6+kn+zf7r/1/7f/e////kfYt/Pv79/2P8z/pP/t8gH/w///va/wD/sf/n2AP3/9vfyr/y+j75X/hf9LqR/jH8V+53+N6McT75l+Iv4v+H9r31R+TP0q/4/UF/Jv6T/rf73+6X+I+Pz9PuBOH/537ZewR7Z/W/91/g/9R+zfwafp/9303/ef9x/4vcB/Xf/ieWZ4gXsn7e/AF/Sf8T/0f9L+Uv02/5v/u/1H+2/ef3nfV//n/0H+x+Qv+cf2v/j/4H/U/tZ883//97/7c///3cv3E/+wb9Hwa2ZTLXP8u0ntYFr8gKqNLErGcjdAwqou4uKM61+QFVF2dQ2udQ1XDhts0AKPoJfg/bI3ucxD+QFTAtpVF24zf1TyS
