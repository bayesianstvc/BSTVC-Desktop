25, 255, 0.22); border-radius: 999px; background: rgba(2, 8, 20, 0.80); color: #dff8ff; backdrop-filter: blur(14px); } body.show-controls .controls { display: flex; } .controls button { border: 0; border-radius: 999px; padding: 7px 12px; background: rgba(82, 211, 255, 0.14); color: inherit; cursor: pointer; } .controls input { width: 118px; accent-color: #45e2f0; } .controls .name { max-width: 220px; font-size: 12px; opacity: 0.76; } body.chromeless .controls { display: none !important; } @media (max-width: 820px) { #scene { inset: -5%; } #source-art { object-position: 12% center; } .shade { background: linear-gradient(180deg, rgba(0, 3, 10, 0.05), transparent 52%, rgba(0, 2, 8, 0.58)), linear-gradient(90deg, rgba(0, 3, 10, 0.08), transparent 70%); } } @media (prefers-reduced-motion: reduce) and (max-width: 0px) { #scene { transform: none !important; } #relation-layer, #star-field, #beta-field, #time-layer { opacity: 0.18 !important; } #earth-texture { transform: none !important; } } /* 方案 A 终稿：地球保持输入图中的静止状态。 */ #earth-texture, #earth-sheen, #spatial-grid { display: none !important; } </style></head><body data-variant="A_FINAL"><main id="bstvc-background"><div id="scene"><img id="source-art" src="data:image/webp;base64,UklGRsKSAQBXRUJQVlA4ILaSAQBw7gWdASqIBq0DPj0ejUUiIaMjohQ4qHAHiWdtevdnrYJWSEjpcZAdXT0mEavH5/S5uPfp+X/F3UblLx5wX22on3HFcwl0BfMqzsP6vb6aVfhA/n71k1R7bcr6v/e9GLkHwd91/if9B/uv8D+6P3cf1v/L6H/C/9f/sf6r8nfiK6H/6f+V/Kv50/83/s/6/3hf1H/Qf8v/M/vH9A36o/5/++/6X/t/4r/////63f3H973+T/6n/X/ZX4Df0H+2/8z/B/vf80//f/ab3V/53/f/9z/g/7r5Af77/kP+f+efx5exx/oP/H/+vcF/p/+S/9HtJ/9X/6/7v/lf/r6Sf7N/uv/Z/tv95///+P9i38//v3/Y/zP+l/+3yAf/D//+9r/AP+x/+fYA/f/2l/J//X6Jvlf+T/2+5T7k/8d+5/+P6SEVb5p+Pf5H+I9sf1SeTv6t98vqEfk/9J/1v+G/c3/F/I1+l/6O8l4r/q/tz7Bftt9j/3P+F/0P7M/Bf+x/1PTr97/3//p9wH9ef+N90HtqeJ17H9Dv2B/0n/E/9b/L/6r9zPpu/0f/b/qv9r+73va+sv/N/ov9t8hf87/tn/I/wH+n/az54///74f3D///u8fuB/9g36Pg1s/kCb9qJ7WBa/ICrbtFReu3kBVRenQA74EsIBVRelYRiLtmQjLZzJdGfmoQc6hu2CH93ZyEZcUwMKqMJZI9w/CSz57tjFLwdlKyBqLl2
