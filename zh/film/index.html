<script id="bstvc-mobile-compat-v56">
(() => {
  const ua = navigator.userAgent || '';
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || window.innerWidth <= 720;
  if (!mobile) return;
  window.__BSTVC_MOBILE_V55__ = true;
  const url = new URL(window.location.href);
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const fastMobileQuality = connection?.saveData || /(^|-)2g$/.test(connection?.effectiveType || '') || window.innerWidth <= 390 ? '360p' : '480p';
  const requested = (url.searchParams.get('quality') || fastMobileQuality).toLowerCase();
  const selected = ['360p', '480p', '1080p', '4k'].includes(requested) ? requested : fastMobileQuality;
  url.searchParams.set('quality', selected);
  url.searchParams.set('mobile', '1');
  window.history.replaceState(null, '', url.href);
  const getContext = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, attributes) {
    if (/^webgl/i.test(type || '')) {
      attributes = Object.assign({}, attributes || {}, { antialias: false, powerPreference: 'low-power', preserveDrawingBuffer: false });
    }
    return getContext.call(this, type, attributes);
  };
})();
