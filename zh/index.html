<script id="bstvc-v43-compat-runtime">
(() => {
  "use strict";
  const revealEverything = () => {
    document.querySelectorAll(".reveal-section").forEach((node) => {
      node.classList.add("is-visible", "bstvc-compat-visible");
    });
    document.querySelectorAll(".motion-paused").forEach((node) => node.classList.remove("motion-paused"));
  };
  if (!("IntersectionObserver" in window)) {
    window.IntersectionObserver = class {
      constructor(callback) { this.callback = callback; }
      observe(target) { this.callback([{ target, isIntersecting: true, intersectionRatio: 1 }], this); }
      unobserve() {}
      disconnect() {}
      takeRecords() { return []; }
    };
    document.documentElement.classList.add("bstvc-legacy-observer");
  }
  if (!("requestAnimationFrame" in window)) {
    window.requestAnimationFrame = (callback) => window.setTimeout(() => callback(Date.now()), 16);
    window.cancelAnimationFrame = (id) => window.clearTimeout(id);
  }

  const frames = Array.from(document.querySelectorAll("[data-motion-frame]"));
  const pending = new Map(frames.map((frame) => [frame.contentWindow, frame]));
  const markReady = (frame) => {
    if (!frame) return;
    frame.classList.add("motion-frame-ready");
    frame.classList.remove("motion-frame-failed");
    frame.dataset.motionState = "ready";
  };
  window.addEventListener("message", (event) => {
    if (!event.data || event.data.type !== "bstvc-motion-ready") return;
    markReady(pending.get(event.source));
  });
  frames.forEach((frame) => {
    frame.addEventListener("load", () => {
      window.setTimeout(() => {
        try {
          const doc = frame.contentDocument;
          if (doc && doc.body && doc.body.childElementCount > 0) markReady(frame);
        } catch (_) {}
      }, 280);
    }, { once: true });
    frame.addEventListener("error", () => frame.classList.add("motion-frame-failed"), { once: true });
  });
  window.setTimeout(() => {
    frames.forEach((frame) => {
      if (!frame.classList.contains("motion-frame-ready")) {
        frame.classList.add("motion-frame-failed");
        frame.dataset.motionState = "fallback";
      }
    });
    if (!("IntersectionObserver" in window) || document.querySelectorAll(".reveal-section.is-visible").length === 0) revealEverything();
  }, 4500);
})();
</script>
<script id="bstvc-v44-local-enhancements">
(() => {
  const lowPerformance = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || (navigator.deviceMemory && navigator.deviceMemory <= 4);
  if (lowPerformance) {
    document.documentElement.classList.add("bstvc-low-performance");
    const background = document.querySelector('.hero-dynamic-background');
    if (background) { const source = background.getAttribute("src") || background.getAttribute("data-motion-src"); if (source && source.indexOf("density=low") < 0) { const next = source + "&density=low"; if (background.getAttribute("src")) background.src = next; else background.setAttribute("data-motion-src", next); } }
  }
  document.querySelectorAll('.models-section .model-card').forEach((card) => {
    const activate = () => card.classList.add('model-is-active');
    const deactivate = () => card.classList.remove('model-is-active');
    card.addEventListener('mouseenter', activate); card.addEventListener('mouseleave', deactivate);
    card.addEventListener('focusin', activate); card.addEventListener('focusout', deactivate);
  });
})();
</script>
<script id="bstvc-v46-hero-parallax">
(() => {
  const hero = document.querySelector('.hero-stage');
  if (!hero) return;
  let frame = 0;
  let x = 0;
  let y = 0;
  const paint = () => {
    frame = 0;
    hero.style.setProperty('--hero-mouse-x', x.toFixed(2) + 'px');
    hero.style.setProperty('--hero-mouse-y', y.toFixed(2) + 'px');
  };
  hero.addEventListener('pointermove', (event) => {
    const rect = hero.getBoundingClientRect();
    x = (((event.clientX - rect.left) / rect.width) - .5) * 3.2;
    y = (((event.clientY - rect.top) / rect.height) - .5) * 2.4;
    if (!frame) frame = requestAnimationFrame(paint);
  }, { passive: true });
  hero.addEventListener('pointerleave', () => { x = 0; y = 0; if (!frame) frame = requestAnimationFrame(paint); }, { passive: true });
})();
</script>

</script><script id="bstvc-v50-motion-loader">
(() => {
  const frames = [...document.querySelectorAll('[data-motion-src]')];
  if (!frames.length) return;
  const reduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const saveData = connection?.saveData === true;
  const mobile = window.matchMedia?.('(max-width: 760px)').matches || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const memory = Number(navigator.deviceMemory || 8);
  const cores = Number(navigator.hardwareConcurrency || 8);
  const lowPower = reduced || saveData || mobile || memory <= 2 || cores <= 2;
  const hero = document.querySelector('.hero-dynamic-background');
  const loadFrame = (frame) => {
    if (!frame || frame.dataset.motionLoaded === 'true') return;
    const src = frame.getAttribute('data-motion-src');
    if (!src) return;
    frame.dataset.motionLoaded = 'true';
    frame.src = src;
  };
  if (lowPower) {
    document.documentElement.classList.add('bstvc-motion-static');
    return;
  }
  const idle = window.requestIdleCallback || ((callback) => window.setTimeout(() => callback({ timeRemaining: () => 0 }), 900));
  if (hero) idle(() => window.setTimeout(() => loadFrame(hero), 260));
  const rest = frames.filter((frame) => frame !== hero);
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        loadFrame(entry.target);
        observer.unobserve(entry.target);
      });
    }, { rootMargin: '420px 0px' });
    rest.forEach((frame) => observer.observe(frame));
  } else {
    window.setTimeout(() => rest.forEach(loadFrame), 1400);
  }
})();
</script></body></html>
